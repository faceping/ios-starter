# FaceCheck: the FacePing iOS starter. FaceCheck.xcodeproj is generated from this file with XcodeGen and committed, so
# you don't need XcodeGen to build. After editing this file: `brew install xcodegen && xcodegen`.
name: FaceCheck
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.1"
  createIntermediateGroups: true
  developmentLanguage: en-GB
packages:
  FacePing:
    url: https://github.com/faceping/faceping-ios
    exactVersion: 1.0.0-preview.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FaceCheck:
    type: application
    platform: iOS
    sources:
      - FaceCheck
    configFiles:
      Debug: Config/FaceCheck.xcconfig
      Release: Config/FaceCheck.xcconfig
    settings:
      base:
        # Change this to your own bundle id, and set your team (Signing & Capabilities, or DEVELOPMENT_TEAM in
        # Config/Local.xcconfig).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.facecheck
        PRODUCT_NAME: FaceCheck
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    info:
      path: FaceCheck/Info.plist
      properties:
        CFBundleDisplayName: FaceCheck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: FaceCheck uses the front camera to check it's you. In the sandbox your face stays on this phone.
        FacePingSandboxKey: $(FACEPING_SANDBOX_KEY)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: FacePing
schemes:
  FaceCheck:
    build:
      targets:
        FaceCheck: all
    run:
      config: Debug
    archive:
      config: Release
