# FaceCheck: the FacePing iOS starter. FaceCheck.xcodeproj is generated from this file with XcodeGen and committed, so
# you don't need XcodeGen to build. After editing this file: `brew install xcodegen && xcodegen`.
name: FaceCheck
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "15.1"
  createIntermediateGroups: true
  developmentLanguage: en-GB
packages:
  FacePing:
    url: https://github.com/faceping/faceping-ios
    exactVersion: 1.0.0-preview.4
settings:
  base:
    SWIFT_VERSION: "5.0"
    # As in a new Xcode 26 App project: imports must be explicit (Combine for ObservableObject, for example).
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FaceCheck:
    type: application
    platform: iOS
    sources:
      - FaceCheck
    configFiles:
      Debug: Config/FaceCheck.xcconfig
      Release: Config/FaceCheck.xcconfig
    settings:
      base:
        # The bundle id and display name are set in Config/FaceCheck.xcconfig, so Config/Local.xcconfig can override
        # them (a separate id for the check-in device build, for example).
        PRODUCT_NAME: FaceCheck
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    info:
      path: FaceCheck/Info.plist
      properties:
        CFBundleDisplayName: $(FACECHECK_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: FaceCheck uses the front camera to check it's you. In the sandbox your face stays on this phone.
        FacePingSandboxKey: $(FACEPING_SANDBOX_KEY)
        FacePingDeviceToken: $(FACEPING_DEVICE_TOKEN)
        FacePingPersonId: $(FACEPING_PERSON_ID)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: FacePing
schemes:
  FaceCheck:
    build:
      targets:
        FaceCheck: all
    run:
      config: Debug
    archive:
      config: Release
